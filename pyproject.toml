[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigilai"
version = "1.0.0"
description = "Production-oriented real-time computer vision analytics platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "email-validator>=2.2.0",
    "scipy>=1.13.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "redis>=5.0.0",
    "aiofiles>=24.1.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "cryptography>=43.0.0",
    "ultralytics>=8.3.0",
    "opencv-python-headless>=4.10.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "onnxruntime>=1.19.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "factory-boy>=3.3.0",
]
gpu = [
    "onnxruntime-gpu>=1.19.0",
]
tensorrt = [
    "tensorrt>=10.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools.packages.find]
where = ["apps/api", "."]
include = ["vigilai_api*", "apps", "apps.worker*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
