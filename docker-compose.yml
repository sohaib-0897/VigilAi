# VigilAI — Docker Compose
# Production-oriented local development stack

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vigilai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vigilai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigilai_dev}
      POSTGRES_DB: ${POSTGRES_DB:-vigilai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigilai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis
  redis:
    image: redis:7-alpine
    container_name: vigilai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: vigilai-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vigilai}:${POSTGRES_PASSWORD:-vigilai_dev}@postgres:5432/${POSTGRES_DB:-vigilai}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-vigilai}:${POSTGRES_PASSWORD:-vigilai_dev}@postgres:5432/${POSTGRES_DB:-vigilai}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-secret-key-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-Y2hhbmdlLXRoaXMtdG8tYS0zMi1ieXRl}
      EVIDENCE_DIR: /app/evidence
      UPLOAD_DIR: /app/uploads
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-yolov8n.pt}
      YOLO_DEVICE: ${YOLO_DEVICE:-cpu}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: '["http://localhost:3000"]'
      FRONTEND_URL: http://localhost:3000
    volumes:
      - evidence_data:/app/evidence
      - upload_data:/app/uploads
      - model_data:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # CV Worker
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: vigilai-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vigilai}:${POSTGRES_PASSWORD:-vigilai_dev}@postgres:5432/${POSTGRES_DB:-vigilai}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-vigilai}:${POSTGRES_PASSWORD:-vigilai_dev}@postgres:5432/${POSTGRES_DB:-vigilai}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-secret-key-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-Y2hhbmdlLXRoaXMtdG8tYS0zMi1ieXRl}
      EVIDENCE_DIR: /app/evidence
      UPLOAD_DIR: /app/uploads
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-yolov8n.pt}
      YOLO_DEVICE: ${YOLO_DEVICE:-cpu}
      MAX_CAMERAS_PER_WORKER: ${MAX_CAMERAS_PER_WORKER:-4}
      FRAME_QUEUE_SIZE: ${FRAME_QUEUE_SIZE:-30}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-5}
    volumes:
      - evidence_data:/app/evidence
      - upload_data:/app/uploads
      - model_data:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: vigilai-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  evidence_data:
    driver: local
  upload_data:
    driver: local
  model_data:
    driver: local
